[build]
  command = "npm run build"
  publish = "dist"

# Configuration des en-têtes de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# Exception pour l'interface Decap CMS
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

# Redirection automatique pour l'accès à l'administration
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
