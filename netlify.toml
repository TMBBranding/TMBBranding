[build]
  command = "npm run build"
  publish = "dist"

# Security Headers Configuration
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# Exception for Decap CMS interface
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

# Automatic redirect for admin access
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
