backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # ==========================================
  # PAGES UNIQUES (Accueil, À Propos, Contact)
  # ==========================================
  - name: "pages"
    label: "Pages"
    delete: false
    files:
      - name: "home"
        label: "Page d'Accueil"
        file: "src/content/pages/home.md"
        format: "frontmatter"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Kicker / Sur-titre", name: "kicker", widget: "string", required: false }
              - { label: "Titre Principal", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
          - { label: "Titre de la section Services", name: "servicesSectionTitle", widget: "string", required: false, default: "Comprehensive Digital Marketing" }
          - { label: "Titre de la section Marques", name: "brandsSectionTitle", widget: "string", required: false, default: "Trusted by Visionary Founders" }
          - label: "Témoignages Clients"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.author}} — {{fields.role}}"
            fields:
              - { label: "Citation / Avis", name: "quote", widget: "text" }
              - { label: "Auteur", name: "author", widget: "string" }
              - { label: "Rôle & Marque", name: "role", widget: "string" }
          - label: "Référencement (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Titre", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Image Open Graph (OG)", name: "ogImage", widget: "image", required: false }

      - name: "services_page"
        label: "Page Services (En-tête & SEO)"
        file: "src/content/pages/services.md"
        format: "frontmatter"
        fields:
          - { label: "Titre Principal", name: "title", widget: "string" }
          - { label: "Sous-titre / Introduction", name: "subtitle", widget: "text" }
          - { label: "Libellé du bouton de contact", name: "inquiryButtonText", widget: "string", required: false, default: "Inquire About This Service" }
          - label: "Référencement (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Titre", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Image Open Graph (OG)", name: "ogImage", widget: "image", required: false }

      - name: "brands_page"
        label: "Page Marques Clientes (En-tête & SEO)"
        file: "src/content/pages/brands.md"
        format: "frontmatter"
        fields:
          - { label: "Titre Principal", name: "title", widget: "string" }
          - { label: "Sous-titre / Introduction", name: "subtitle", widget: "text" }
          - label: "Référencement (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Titre", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Image Open Graph (OG)", name: "ogImage", widget: "image", required: false }

      - name: "about"
        label: "Page À Propos"
        file: "src/content/pages/about.md"
        format: "frontmatter"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre / Titre Histoire", name: "subtitle", widget: "text", required: false }
          - label: "Biographie Fondatrice (Tiffany)"
            name: "bioFounder"
            widget: "object"
            fields:
              - { label: "Nom complet", name: "name", widget: "string" }
              - { label: "Portrait", name: "portraitImage", widget: "image" }
              - { label: "Biographie & Vision", name: "body", widget: "markdown" }
          - { label: "Texte d'invitation final avec liens", name: "closingText", widget: "string", required: false, hint: "Exemple: We’d love to work with you. [Get in touch](/contact) or visit our [Brands](/brands) page." }
          - label: "Référencement (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Titre", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Image Open Graph (OG)", name: "ogImage", widget: "image", required: false }

      - name: "contact"
        label: "Page Contact"
        file: "src/content/pages/contact.md"
        format: "frontmatter"
        fields:
          - { label: "Titre Principal", name: "title", widget: "string" }
          - { label: "Sous-titre", name: "subtitle", widget: "text" }
          - label: "Options de Services demandés"
            name: "serviceOptions"
            widget: "list"
            default:
              - "Social Media Strategy"
              - "Strategic Partnerships & Influencers"
              - "Thought Leadership & Founder Branding"
              - "Email Marketing & Automation"
              - "Paid Social Advertising"
              - "Events & Activations"
              - "Something else"
            field: { label: "Option de Service", name: "option", widget: "string" }
          - label: "Fourchettes de Budget"
            name: "budgetOptions"
            widget: "list"
            field: { label: "Fourchette de budget", name: "budget", widget: "string" }
          - label: "Référencement (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Titre", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Image Open Graph (OG)", name: "ogImage", widget: "image", required: false }

      - name: "settings"
        label: "Coordonnées & Pied de Page"
        file: "src/content/pages/settings.md"
        format: "frontmatter"
        fields:
          - { label: "Titre bloc Projet (Footer)", name: "inquiriesTitle", widget: "string", default: "Initiate a Project" }
          - { label: "Texte d'introduction (Footer)", name: "inquiriesText", widget: "text" }
          - { label: "Texte du lien Contact", name: "contactLinkText", widget: "string", default: "Contact us" }
          - { label: "Téléphone", name: "phone", widget: "string", default: "+1 512 529 1677" }
          - { label: "Email de contact", name: "email", widget: "string", default: "tiffany@tmbbranding.com" }
          - { label: "Titre Réseaux Sociaux", name: "socialTitle", widget: "string", default: "Follow Us" }
          - { label: "Sous-titre Réseaux Sociaux", name: "socialSubtitle", widget: "string", default: "Stories & founder perspectives" }
          - { label: "Identifiant Instagram", name: "instagramHandle", widget: "string", default: "@tmbbranding" }
          - { label: "Lien Instagram", name: "instagramUrl", widget: "string", default: "https://www.instagram.com/tmbbranding/" }
          - { label: "Ville / Siège", name: "location", widget: "string", default: "Austin, Texas" }
          - { label: "Libellé Siège (Pied de page)", name: "headquartersText", widget: "string", default: "Headquarters: Austin, TX" }
          - { label: "Libellé International (Pied de page)", name: "worldwideText", widget: "string", default: "Worldwide" }

  # ==========================================
  # COLLECTION SERVICES (Fichiers multiples)
  # ==========================================
  - name: "services"
    label: "Services"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre du Service", name: "title", widget: "string" }
      - { label: "Ordre d'affichage", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Description courte", name: "shortDescription", widget: "text" }
      - { label: "Image de Couverture", name: "coverImage", widget: "image" }
      - { label: "Description Détaillée (Markdown)", name: "body", widget: "markdown" }

  # ==========================================
  # COLLECTION BRANDS (Portfolio clients)
  # ==========================================
  - name: "brands"
    label: "Marques Clientes"
    folder: "src/content/brands"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom de la Marque", name: "name", widget: "string" }
      - { label: "Ordre d'affichage", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Logo", name: "logoImage", widget: "image" }
      - { label: "Image de Couverture", name: "coverImage", widget: "image" }
      - { label: "Présentation / Étude de Cas (Markdown)", name: "body", widget: "markdown" }
