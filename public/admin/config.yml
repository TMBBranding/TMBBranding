backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # ==========================================
  # SINGLE PAGES (Home, About, Contact)
  # ==========================================
  - name: "pages"
    label: "Pages"
    delete: false
    files:
      - name: "home"
        label: "Home Page"
        file: "src/content/pages/home.md"
        format: "frontmatter"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Kicker / Header Accent", name: "kicker", widget: "string", required: false }
              - { label: "Main Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Background Video (Hero)", name: "video", widget: "file", required: false, default: "/videos/hero-workspace.mp4", hint: "Full-screen background video file (MP4, WebM, etc.)" }
              - { label: "Preview Image (Poster)", name: "posterImage", widget: "image", required: false, default: "/videos/preview-frame.jpg", hint: "Image displayed while the video is loading" }
          - { label: "Services Section Title", name: "servicesSectionTitle", widget: "string", required: false, default: "Boutique Brand & Digital Marketing" }
          - { label: "Brands Section Title", name: "brandsSectionTitle", widget: "string", required: false, default: "Trusted by Visionary Founders" }
          - label: "Client Testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.author}} — {{fields.role}}"
            fields:
              - { label: "Quote / Testimonial", name: "quote", widget: "text" }
              - { label: "Author", name: "author", widget: "string" }
              - { label: "Role & Brand", name: "role", widget: "string" }
          - label: "Search Engine Optimization (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Title", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Open Graph Image (OG)", name: "ogImage", widget: "image", required: false }

      - name: "services_page"
        label: "Services Page (Header & SEO)"
        file: "src/content/pages/services.md"
        format: "frontmatter"
        fields:
          - { label: "Main Title", name: "title", widget: "string" }
          - { label: "Subtitle / Introduction", name: "subtitle", widget: "text" }
          - { label: "Inquiry Button Text", name: "inquiryButtonText", widget: "string", required: false, default: "Inquire About This Service" }
          - label: "Search Engine Optimization (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Title", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Open Graph Image (OG)", name: "ogImage", widget: "image", required: false }

      - name: "brands_page"
        label: "Brands Page (Header & SEO)"
        file: "src/content/pages/brands.md"
        format: "frontmatter"
        fields:
          - { label: "Main Title", name: "title", widget: "string" }
          - { label: "Subtitle / Introduction", name: "subtitle", widget: "text" }
          - label: "Search Engine Optimization (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Title", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Open Graph Image (OG)", name: "ogImage", widget: "image", required: false }

      - name: "about"
        label: "About Page"
        file: "src/content/pages/about.md"
        format: "frontmatter"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle / Story Title", name: "subtitle", widget: "text", required: false }
          - label: "Founder Biography (Tiffany)"
            name: "bioFounder"
            widget: "object"
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Portrait Photo", name: "portraitImage", widget: "image" }
              - { label: "Biography & Vision", name: "body", widget: "markdown", hint: "First paragraphs appear next to the portrait photo. The paragraph starting with 'Then a transition into beauty' and following ones stretch full-width below." }
          - { label: "Closing Invitation Text with Links", name: "closingText", widget: "string", required: false, hint: "Example: We’d love to work with you. [Get in touch](/contact) or visit our [Brands](/brands) page." }
          - label: "Search Engine Optimization (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Title", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Open Graph Image (OG)", name: "ogImage", widget: "image", required: false }

      - name: "contact"
        label: "Contact Page"
        file: "src/content/pages/contact.md"
        format: "frontmatter"
        fields:
          - { label: "Main Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "text" }
          - { label: "Dropdown Placeholder Text", name: "servicePlaceholder", widget: "string", default: "Select an option", required: false }
          - label: "Inquiry Service Options"
            name: "serviceOptions"
            widget: "list"
            default:
              - "Social Media Strategy"
              - "Strategic Partnerships"
              - "Thought Leadership & Branding"
              - "Email Marketing"
              - "Paid Social"
              - "Events & Activations"
              - "Something else"
            field: { label: "Service Option", name: "option", widget: "string" }
          - label: "Budget Ranges"
            name: "budgetOptions"
            widget: "list"
            field: { label: "Budget Range", name: "budget", widget: "string" }
          - { label: "Submit Button Text", name: "submitButtonText", widget: "string", default: "Submit", required: false }
          - label: "Search Engine Optimization (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Title", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Open Graph Image (OG)", name: "ogImage", widget: "image", required: false }

      - name: "settings"
        label: "Contact Information & Footer"
        file: "src/content/pages/settings.md"
        format: "frontmatter"
        fields:
          - { label: "Inquiries Section Title (Footer)", name: "inquiriesTitle", widget: "string", default: "WORK WITH TMB" }
          - { label: "Contact Link Text", name: "contactLinkText", widget: "string", default: "Contact us" }
          - { label: "Phone Number", name: "phone", widget: "string", default: "+1 512 529 1677" }
          - { label: "Contact Email", name: "email", widget: "string", default: "tiffany@tmbbranding.com" }
          - { label: "Social Section Title", name: "socialTitle", widget: "string", default: "Follow Us" }
          - { label: "Instagram Handle", name: "instagramHandle", widget: "string", default: "@tmbbranding" }
          - { label: "Instagram URL", name: "instagramUrl", widget: "string", default: "https://www.instagram.com/tmbbranding/" }
          - { label: "City / Headquarters", name: "location", widget: "string", default: "Austin, Texas" }
          - { label: "Copyright Text (Footer)", name: "copyrightText", widget: "string", default: "© 2026 TMB Branding. All rights reserved." }

      - name: "theme"
        label: "Theme & Color Palette"
        file: "src/content/pages/theme.md"
        format: "frontmatter"
        fields:
          - label: "Neutral Bases (Backgrounds)"
            name: "creme"
            widget: "object"
            fields:
              - { label: "Primary Background (Creme Powder)", name: "powder", widget: "color", default: "#FAF7F2" }
              - { label: "Secondary Background / Cards (Alabaster)", name: "alabaster", widget: "color", default: "#F3EFEA" }
              - { label: "Border Color", name: "border", widget: "color", default: "#E4DDD4" }

          - label: "Primary Accent Shade (Cognac / Warm Terracotta)"
            name: "terracotta"
            widget: "object"
            fields:
              - { label: "Primary Cognac (Hover buttons, links)", name: "default", widget: "color", default: "#9E6742" }
              - { label: "Dark Cognac (Active / Pressed)", name: "dark", widget: "color", default: "#7D4B2A" }
              - { label: "Light Cognac (Subtle hovers)", name: "light", widget: "color", default: "#BD835C" }

          - label: "Typography & Headings (Espresso)"
            name: "espresso"
            widget: "object"
            fields:
              - { label: "Primary Espresso (Headings, buttons & sections)", name: "default", widget: "color", default: "#382820" }
              - { label: "Deep Espresso (Video overlay / shadows)", name: "deep", widget: "color", default: "#1C1513" }

          - label: "Secondary Text (Taupe)"
            name: "taupe"
            widget: "object"
            fields:
              - { label: "Primary Taupe (Subtitles & descriptions)", name: "default", widget: "color", default: "#6B5C55" }
              - { label: "Light Taupe", name: "light", widget: "color", default: "#94847D" }

          - label: "Kickers & Golden Accents (Champagne / Bronze)"
            name: "ocre"
            widget: "object"
            fields:
              - { label: "Primary Champagne (Kickers & accent lines)", name: "default", widget: "color", default: "#C29B72" }
              - { label: "Light Champagne (Accents on dark background)", name: "light", widget: "color", default: "#D8B58F" }

  # ==========================================
  # SERVICES COLLECTION (Multiple files)
  # ==========================================
  - name: "services"
    label: "Services"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Service Title", name: "title", widget: "string" }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Short Description", name: "shortDescription", widget: "text" }
      - { label: "Cover Image", name: "coverImage", widget: "image" }
      - { label: "Detailed Description (Markdown)", name: "body", widget: "markdown" }

  # ==========================================
  # BRANDS COLLECTION (Client portfolio)
  # ==========================================
  - name: "brands"
    label: "Client Brands"
    folder: "src/content/brands"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Brand Name", name: "name", widget: "string" }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Logo", name: "logoImage", widget: "image" }
      - { label: "Cover Image", name: "coverImage", widget: "image" }
      - { label: "Case Study / Overview (Markdown)", name: "body", widget: "markdown" }
