backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # ==========================================
  # PAGES UNIQUES (Accueil, À Propos, Contact)
  # ==========================================
  - name: "pages"
    label: "Pages"
    delete: false
    files:
      - name: "home"
        label: "Page d'Accueil"
        file: "src/content/pages/home.md"
        format: "frontmatter"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Kicker / Sur-titre", name: "kicker", widget: "string", required: false }
              - { label: "Titre Principal", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
              - { label: "Vidéo d'arrière-plan (Hero)", name: "video", widget: "file", required: false, default: "/videos/hero-workspace.mp4", hint: "Fichier vidéo (MP4, WebM, etc.) affiché en fond plein écran" }
              - { label: "Image de prévisualisation (Poster)", name: "posterImage", widget: "image", required: false, default: "/videos/preview-frame.jpg", hint: "Image affichée pendant le chargement de la vidéo" }
          - { label: "Titre de la section Services", name: "servicesSectionTitle", widget: "string", required: false, default: "Boutique Brand & Digital Marketing" }
          - { label: "Titre de la section Marques", name: "brandsSectionTitle", widget: "string", required: false, default: "Trusted by Visionary Founders" }
          - label: "Témoignages Clients"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.author}} — {{fields.role}}"
            fields:
              - { label: "Citation / Avis", name: "quote", widget: "text" }
              - { label: "Auteur", name: "author", widget: "string" }
              - { label: "Rôle & Marque", name: "role", widget: "string" }
          - label: "Référencement (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Titre", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Image Open Graph (OG)", name: "ogImage", widget: "image", required: false }

      - name: "services_page"
        label: "Page Services (En-tête & SEO)"
        file: "src/content/pages/services.md"
        format: "frontmatter"
        fields:
          - { label: "Titre Principal", name: "title", widget: "string" }
          - { label: "Sous-titre / Introduction", name: "subtitle", widget: "text" }
          - { label: "Libellé du bouton de contact", name: "inquiryButtonText", widget: "string", required: false, default: "Inquire About This Service" }
          - label: "Référencement (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Titre", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Image Open Graph (OG)", name: "ogImage", widget: "image", required: false }

      - name: "brands_page"
        label: "Page Marques Clientes (En-tête & SEO)"
        file: "src/content/pages/brands.md"
        format: "frontmatter"
        fields:
          - { label: "Titre Principal", name: "title", widget: "string" }
          - { label: "Sous-titre / Introduction", name: "subtitle", widget: "text" }
          - label: "Référencement (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Titre", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Image Open Graph (OG)", name: "ogImage", widget: "image", required: false }

      - name: "about"
        label: "Page À Propos"
        file: "src/content/pages/about.md"
        format: "frontmatter"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre / Titre Histoire", name: "subtitle", widget: "text", required: false }
          - label: "Biographie Fondatrice (Tiffany)"
            name: "bioFounder"
            widget: "object"
            fields:
              - { label: "Nom complet", name: "name", widget: "string" }
              - { label: "Portrait", name: "portraitImage", widget: "image" }
              - { label: "Biographie & Vision", name: "body", widget: "markdown", hint: "Les premiers paragraphes s'affichent à côté du portrait. Le paragraphe débutant par 'Then a transition into beauty' et les suivants s'étendent sur toute la largeur sous la photo." }
          - { label: "Texte d'invitation final avec liens", name: "closingText", widget: "string", required: false, hint: "Exemple: We’d love to work with you. [Get in touch](/contact) or visit our [Brands](/brands) page." }
          - label: "Référencement (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Titre", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Image Open Graph (OG)", name: "ogImage", widget: "image", required: false }

      - name: "contact"
        label: "Page Contact"
        file: "src/content/pages/contact.md"
        format: "frontmatter"
        fields:
          - { label: "Titre Principal", name: "title", widget: "string" }
          - { label: "Sous-titre", name: "subtitle", widget: "text" }
          - label: "Options de Services demandés"
            name: "serviceOptions"
            widget: "list"
            default:
              - "Social Media Strategy"
              - "Strategic Partnerships & Influencers"
              - "Thought Leadership & Founder Branding"
              - "Email Marketing & Automation"
              - "Paid Social Advertising"
              - "Events & Activations"
              - "Something else"
            field: { label: "Option de Service", name: "option", widget: "string" }
          - label: "Fourchettes de Budget"
            name: "budgetOptions"
            widget: "list"
            field: { label: "Fourchette de budget", name: "budget", widget: "string" }
          - { label: "Texte du bouton d'envoi", name: "submitButtonText", widget: "string", default: "Submit", required: false }
          - label: "Référencement (SEO)"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Meta Titre", name: "metaTitle", widget: "string" }
              - { label: "Meta Description", name: "metaDescription", widget: "text" }
              - { label: "Image Open Graph (OG)", name: "ogImage", widget: "image", required: false }

      - name: "settings"
        label: "Coordonnées & Pied de Page"
        file: "src/content/pages/settings.md"
        format: "frontmatter"
        fields:
          - { label: "Titre bloc Projet (Footer)", name: "inquiriesTitle", widget: "string", default: "WORK WITH TMB" }
          - { label: "Texte d'accroche (Footer)", name: "inquiriesSubtitle", widget: "text", default: "New beginnings. Next chapters. Meaningful growth. Let's build what's next." }
          - { label: "Texte du lien Contact", name: "contactLinkText", widget: "string", default: "Contact us" }
          - { label: "Téléphone", name: "phone", widget: "string", default: "+1 512 529 1677" }
          - { label: "Email de contact", name: "email", widget: "string", default: "tiffany@tmbbranding.com" }
          - { label: "Titre Réseaux Sociaux", name: "socialTitle", widget: "string", default: "Follow Us" }
          - { label: "Identifiant Instagram", name: "instagramHandle", widget: "string", default: "@tmbbranding" }
          - { label: "Lien Instagram", name: "instagramUrl", widget: "string", default: "https://www.instagram.com/tmbbranding/" }
          - { label: "Ville / Siège", name: "location", widget: "string", default: "Austin, Texas" }
          - { label: "Texte de Copyright (Bas de page)", name: "copyrightText", widget: "string", default: "© 2026 TMB Branding. All rights reserved." }

      - name: "theme"
        label: "Thème & Couleurs"
        file: "src/content/pages/theme.md"
        format: "frontmatter"
        fields:
          - label: "Bases Neutres (Fonds)"
            name: "creme"
            widget: "object"
            fields:
              - { label: "Fond Principal (Crème)", name: "powder", widget: "color", default: "#FAF7F2" }
              - { label: "Fond Secondaire / Cartes (Alabaster)", name: "alabaster", widget: "color", default: "#F3EFEA" }
              - { label: "Couleur des Bordures", name: "border", widget: "color", default: "#E4DDD4" }

          - label: "Teinte d'Accentuation Principale (Terracotta)"
            name: "terracotta"
            widget: "object"
            fields:
              - { label: "Terracotta Principal", name: "default", widget: "color", default: "#C86D51" }
              - { label: "Terracotta Foncé (Bordures / Fonds sombres)", name: "dark", widget: "color", default: "#B85C42" }
              - { label: "Terracotta Clair (Survols)", name: "light", widget: "color", default: "#D97E63" }

          - label: "Typographie & Titres (Espresso)"
            name: "espresso"
            widget: "object"
            fields:
              - { label: "Espresso Principal (Titres & Boutons)", name: "default", widget: "color", default: "#241B18" }
              - { label: "Espresso Foncé (Voile Vidéo / Ombres)", name: "deep", widget: "color", default: "#1C1513" }

          - label: "Textes Secondaires (Taupe)"
            name: "taupe"
            widget: "object"
            fields:
              - { label: "Taupe Principal (Sous-titres & Descriptions)", name: "default", widget: "color", default: "#6B5C55" }
              - { label: "Taupe Clair", name: "light", widget: "color", default: "#94847D" }

          - label: "Surtitres & Détails Dorés (Ocre)"
            name: "ocre"
            widget: "object"
            fields:
              - { label: "Ocre Principal (Kickers & Lignes)", name: "default", widget: "color", default: "#D99B59" }
              - { label: "Ocre Clair", name: "light", widget: "color", default: "#E6AE6E" }

  # ==========================================
  # COLLECTION SERVICES (Fichiers multiples)
  # ==========================================
  - name: "services"
    label: "Services"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre du Service", name: "title", widget: "string" }
      - { label: "Ordre d'affichage", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Description courte", name: "shortDescription", widget: "text" }
      - { label: "Image de Couverture", name: "coverImage", widget: "image" }
      - { label: "Description Détaillée (Markdown)", name: "body", widget: "markdown" }

  # ==========================================
  # COLLECTION BRANDS (Portfolio clients)
  # ==========================================
  - name: "brands"
    label: "Marques Clientes"
    folder: "src/content/brands"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom de la Marque", name: "name", widget: "string" }
      - { label: "Ordre d'affichage", name: "order", widget: "number", value_type: "int", default: 1 }
      - { label: "Logo", name: "logoImage", widget: "image" }
      - { label: "Image de Couverture", name: "coverImage", widget: "image" }
      - { label: "Présentation / Étude de Cas (Markdown)", name: "body", widget: "markdown" }
