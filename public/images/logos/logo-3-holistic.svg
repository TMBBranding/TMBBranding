<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;display=swap');
      .title-holistic {
        font-family: 'Cormorant Garamond', serif;
        font-size: 64px;
        font-weight: 300;
        letter-spacing: 0.16em;
        fill: #241B18;
      }
      .branding-tag {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.48em;
        fill: #82533D;
        text-transform: uppercase;
      }
      .arc-glow {
        fill: none;
        stroke: url(#goldGradient);
        stroke-width: 1.5;
        stroke-linecap: round;
      }
    </style>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D99B59" />
      <stop offset="50%" stop-color="#C86D51" />
      <stop offset="100%" stop-color="#82533D" />
    </linearGradient>
  </defs>

  <g transform="translate(60, 20)">
    <!-- Holistic Emblem: Fine Botanical / Cellular Arc -->
    <g transform="translate(70, 100)">
      <!-- Outer crescent arc -->
      <path d="M -42 -20 A 46 46 0 1 1 36 -26" stroke="#C86D51" stroke-width="1.3" fill="none" stroke-linecap="round" />
      <!-- Inner soft crescent -->
      <path d="M -30 -10 A 34 34 0 1 0 26 22" stroke="#D99B59" stroke-width="0.9" stroke-dasharray="1 3" fill="none" />
      
      <!-- Organic leaf / teardrop droplet (beauty & health) -->
      <path d="M 0 -36 C 10 -24 16 -10 0 12 C -16 -10 -10 -24 0 -36 Z" fill="none" stroke="#82533D" stroke-width="1.1" />
      <circle cx="0" cy="-6" r="3" fill="#C86D51" />
      <circle cx="36" cy="-26" r="2" fill="#D99B59" />
    </g>

    <!-- Content Block -->
    <g transform="translate(180, 75)">
      <text x="0" y="26" class="title-holistic">
        TMB <tspan font-weight="400" fill="#C86D51">BRANDING</tspan>
      </text>
      
      <!-- Subtitle & values -->
      <g transform="translate(4, 52)">
        <text x="0" y="0" class="branding-tag">INTELLIGENCE &Eacute;STH&Eacute;TIQUE &middot; BIEN-&Ecirc;TRE</text>
        <line x1="0" y1="12" x2="380" y2="12" stroke="#E4DDD4" stroke-width="0.8" />
      </g>
    </g>
  </g>
</svg>
