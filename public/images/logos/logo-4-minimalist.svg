<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&amp;display=swap');
      .title-sans {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 50px;
        font-weight: 300;
        letter-spacing: 0.32em;
        fill: #1C1513;
      }
      .title-bold {
        font-weight: 600;
        letter-spacing: 0.28em;
        fill: #241B18;
      }
      .branding-sans {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.65em;
        fill: #C86D51;
        text-transform: uppercase;
      }
      .clinical-grid {
        stroke: #241B18;
        stroke-width: 1.5;
        fill: none;
      }
    </style>
  </defs>

  <g transform="translate(60, 20)">
    <!-- Architectural Minimalist Seal: 3 Precision Elements (T - M - B abstracted) -->
    <g transform="translate(70, 100)">
      <!-- Precision Square Frame with Chamfered / Rounded Luxury corners -->
      <rect x="-44" y="-44" width="88" height="88" rx="8" stroke="#1C1513" stroke-width="1.4" fill="none" />
      
      <!-- Inside geometric monoline: T cross, M peaks, B curves -->
      <!-- T element -->
      <line x1="-24" y1="-22" x2="24" y2="-22" stroke="#1C1513" stroke-width="1.4" />
      <line x1="0" y1="-22" x2="0" y2="24" stroke="#1C1513" stroke-width="1.4" />
      
      <!-- Minimalist geometric dot matrix accent -->
      <circle cx="-16" cy="4" r="2.5" fill="#C86D51" />
      <circle cx="16" cy="4" r="2.5" fill="#D99B59" />
      <circle cx="0" cy="14" r="2.5" fill="#82533D" />
    </g>

    <!-- Typography Block -->
    <g transform="translate(180, 85)">
      <text x="0" y="20" class="title-sans">
        <tspan class="title-bold">TMB</tspan> BRANDING
      </text>
      
      <g transform="translate(4, 46)">
        <text x="0" y="0" class="branding-sans">STRATEGIC DESIGN &middot; BEAUTY &middot; CLINICAL CARE</text>
      </g>
    </g>
  </g>
</svg>
