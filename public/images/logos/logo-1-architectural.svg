<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;display=swap');
      .brand-title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 58px;
        font-weight: 400;
        letter-spacing: 0.18em;
        fill: #241B18;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.42em;
        fill: #82533D;
      }
      .monogram-line {
        stroke: #241B18;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .accent-line {
        stroke: #C86D51;
        stroke-width: 1.25;
        fill: none;
      }
    </style>
  </defs>

  <!-- Background subtle option: none for transparency -->

  <g transform="translate(40, 20)">
    <!-- Monogram Emblem: Sacred Geometry & Interlocking T-M-B -->
    <g transform="translate(60, 100)">
      <!-- Outer delicate circle -->
      <circle cx="0" cy="0" r="54" stroke="#E4DDD4" stroke-width="1.2" fill="none" />
      <circle cx="0" cy="0" r="48" stroke="#C86D51" stroke-width="0.8" stroke-dasharray="2 4" fill="none" />
      
      <!-- Central Monogram glyphs stylized -->
      <!-- T stem & bar -->
      <path d="M -22 -22 L 22 -22" class="monogram-line" />
      <path d="M 0 -22 L 0 24" class="monogram-line" />
      
      <!-- M graceful arches -->
      <path d="M -18 22 L -18 -8 Q -10 -20 -2 -8 L 0 -5 Q 2 -20 10 -8 L 18 22" class="accent-line" />
      
      <!-- B loop harmony -->
      <path d="M 0 -12 Q 16 -12 16 -1 Q 16 9 0 9" stroke="#82533D" stroke-width="1.4" fill="none" />
      <path d="M 0 9 Q 18 9 18 22 Q 18 24 0 24" stroke="#82533D" stroke-width="1.4" fill="none" />
      
      <!-- Fine center anchor dot -->
      <circle cx="0" cy="-22" r="2" fill="#C86D51" />
    </g>

    <!-- Divider hairline -->
    <line x1="160" y1="55" x2="160" y2="145" stroke="#E4DDD4" stroke-width="1" />

    <!-- Typography Block -->
    <g transform="translate(195, 0)">
      <text x="0" y="102" class="brand-title">TMB</text>
      <text x="180" y="102" class="brand-title" font-weight="300" fill="#82533D">BRANDING</text>
      
      <!-- Underline / Subtitle bar -->
      <line x1="2" y1="124" x2="480" y2="124" stroke="#E4DDD4" stroke-width="1" />
      <circle cx="2" cy="124" r="2" fill="#C86D51" />
      <circle cx="480" cy="124" r="2" fill="#C86D51" />
      
      <!-- Positioning tagline -->
      <text x="3" y="146" class="brand-sub">LUXURY &middot; BEAUTY &middot; HEALTHCARE</text>
    </g>
  </g>
</svg>
